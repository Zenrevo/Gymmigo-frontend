<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F1F1F3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Gymmigo: gyms, runs and an AI coach in one app</title>
    <meta name="google-site-verification" content="YdyX_6hOk44soE0-Ihyn7oNJn44Ds7pdr4D7uloScds" />

    <!-- Obsidian Kinetic type: Epilogue (headlines) + Inter (UI), same as the mobile app. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <meta name="description" content="Find a gym near you, check in with QR, follow training plans you approve, and run with friends on a live map. Free for members." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gymmigo" />
    <meta property="og:title" content="Gymmigo: gyms, runs and an AI coach in one app" />
    <meta property="og:description" content="Find a gym near you, check in with QR, follow training plans you approve, and run with friends on a live map." />
    <meta property="og:image" content="https://gymmigo.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://gymmigo.in/og-image.png" />

    <!-- Apply the saved theme before first paint (no light/dark flash). Mirrors ThemeProvider. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('gymmigo_theme') || 'light';
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var scheme = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', scheme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#131315' : '#F1F1F3');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        .splash-screen {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #131315;
          background-image: radial-gradient(60% 40% at 85% 0%, rgba(255, 87, 34, 0.18) 0%, rgba(255, 87, 34, 0) 70%);
          color: #E5E1E4;
          font-family: 'Inter', system-ui, sans-serif;
          z-index: 9999;
          gap: 20px;
        }
        .splash-logo {
          width: 72px;
          height: 72px;
          border-radius: 20px;
          background: #201F22;
          border: 1px solid #2C2B2F;
          display: flex;
          align-items: center;
          justify-content: center;
          animation: splash-breathe 1.8s ease-in-out infinite;
        }
        .splash-logo img { width: 70%; height: 70%; object-fit: contain; }
        .splash-word {
          font-family: 'Epilogue', 'Inter', sans-serif;
          font-weight: 800;
          font-size: 22px;
          letter-spacing: 1px;
        }
        .splash-word span { color: #FF5722; }
        .splash-bar {
          width: 96px;
          height: 3px;
          border-radius: 3px;
          background: #2A2A2C;
          overflow: hidden;
          position: relative;
        }
        .splash-bar::after {
          content: '';
          position: absolute;
          inset: 0;
          width: 40%;
          border-radius: 3px;
          background: #FF5722;
          animation: splash-slide 1.1s ease-in-out infinite;
        }
        @keyframes splash-breathe {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.04); }
        }
        @keyframes splash-slide {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
      </style>
      <div class="splash-screen">
        <div class="splash-logo"><img src="/logo.png" alt="" /></div>
        <div class="splash-word">GYM<span>MIGO</span></div>
        <div class="splash-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
